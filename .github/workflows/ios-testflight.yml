# iOS 빌드 → TestFlight 업로드 (온기 ios-testflight.yml 과 같은 구조).
# 서명은 EAS 가 아니라 Xcode 자동 서명 + App Store Connect API 키(클라우드 관리 인증서)로 한다 — 인증서·프로파일 수동 관리 없음.
# 실행: gh workflow run ios-testflight.yml  (또는 Actions 탭에서 Run workflow)
# 필요한 시크릿: ASC_KEY_ID · ASC_ISSUER_ID · ASC_PRIVATE_KEY (App Store Connect API 키, App Manager)
# 빌드 번호 = GitHub run number (CURRENT_PROJECT_VERSION), 버전 = app.json version
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      APP_ID: com.artinfokorea.app
      TEAM_ID: D7RV3R6ALY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Apple 은 최신 Xcode/iOS SDK 로 빌드한 앱만 받는다 — 러너 기본 Xcode 버전을 로그에 남긴다
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate native project (expo prebuild)
        run: CI=1 npx expo prebuild --platform ios --clean

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/asc/AuthKey_${ASC_KEY_ID}.p8"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build (archive + export, automatic signing with API key)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          lane :build do
            key_path = File.join(ENV['HOME'], 'asc', "AuthKey_#{ENV['ASC_KEY_ID']}.p8")
            auth = "-allowProvisioningUpdates -authenticationKeyPath #{key_path} -authenticationKeyID #{ENV['ASC_KEY_ID']} -authenticationKeyIssuerID #{ENV['ASC_ISSUER_ID']}"
            update_code_signing_settings(
              path: 'ios/ArtInfo.xcodeproj',
              use_automatic_signing: true,
              team_id: ENV['TEAM_ID'],
              bundle_identifier: ENV['APP_ID'],
            )
            increment_build_number(xcodeproj: 'ios/ArtInfo.xcodeproj', build_number: ENV['BUILD_NUMBER'])
            build_app(
              workspace: 'ios/ArtInfo.xcworkspace',
              scheme: 'ArtInfo',
              configuration: 'Release',
              export_method: 'app-store',
              output_directory: '.',
              output_name: 'artinfo.ipa',
              xcargs: auth,
              export_xcargs: auth,
              export_options: { signingStyle: 'automatic', teamID: ENV['TEAM_ID'], uploadSymbols: true },
            )
          end
          lane :upload do
            api_key = app_store_connect_api_key(
              key_id: ENV['ASC_KEY_ID'],
              issuer_id: ENV['ASC_ISSUER_ID'],
              key_content: ENV['ASC_PRIVATE_KEY'],
            )
            upload_to_testflight(
              api_key: api_key,
              app_identifier: ENV['APP_ID'],
              ipa: './artinfo.ipa',
              skip_submission: true,
              skip_waiting_for_build_processing: true,
            )
          end
          RUBY
          fastlane build

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artinfo-ios-ipa
          path: ./artinfo.ipa
          if-no-files-found: ignore
          retention-days: 7

      # App Store Connect API 키로 Apple 에 직접 올린다 (EAS Submit 큐 대기 없음)
      - name: Upload to TestFlight
        run: fastlane upload
