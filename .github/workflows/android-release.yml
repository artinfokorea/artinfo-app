# Android 릴리즈 번들(.aab)·테스트 설치용 APK 빌드 → (시크릿이 있으면) Play Console 내부 테스트 트랙 업로드. iOS 의 ios-testflight.yml 과 짝.
# 실행: gh workflow run android-release.yml  (또는 Actions 탭에서 Run workflow)
# 필요한 시크릿:
#   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD  (업로드 키, scripts/android-keystore.sh)
#   EXPO_PUBLIC_KAKAO_REST_API_KEY · EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY  (카카오 로그인·지도, 번들 시 인라인)
#   GOOGLE_SERVICES_JSON  (Firebase 의 google-services.json 내용 — 푸시(FCM). 없으면 푸시만 빠진 채 빌드)
#   PLAY_SERVICE_ACCOUNT_JSON  (Play Console API 서비스 계정 키 — 있으면 내부 테스트 트랙에 자동 업로드, 없으면 artifact 만)
# 키스토어 시크릿이 없으면 디버그 키로 서명된 .aab 를 만들어 빌드 검증만 한다 (Play 에는 올릴 수 없음).
# versionCode = GitHub run number, versionName = app.json version
name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_KAKAO_REST_API_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_REST_API_KEY }}
      EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      APP_ID: com.artinfokorea.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 러너에는 Android SDK 가 기본 설치돼 있다(ANDROID_HOME) — setup-android 액션은 'tools' 패키지 오류로 실패해 쓰지 않는다
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Firebase 설정 — 시크릿이 비어 있으면 파일을 만들지 않는다 (app.config.ts 가 없으면 건너뜀)
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json 작성"
          else
            echo "::warning::GOOGLE_SERVICES_JSON 시크릿이 없어 Android 푸시 없이 빌드합니다"
          fi

      - name: Write upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/android-keys"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/android-keys/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/android-keys/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 디버그 키로 서명합니다 (Play 업로드 불가)"
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CI=1 npx expo prebuild --platform android --clean
          printf '\napply from: "../../scripts/android-signing.gradle"\n' >> android/app/build.gradle
          cd android && ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
          cd .. && cp android/app/build/outputs/bundle/release/app-release.aab ./artinfo.aab
          cp android/app/build/outputs/apk/release/app-release.apk ./artinfo.apk

      # 테스트 설치용 APK — Actions 실행 페이지의 Artifacts 에서 내려받아 폰에 설치 (Play 제출은 .aab)
      - name: Upload apk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artinfo-android-apk
          path: ./artinfo.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload aab artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artinfo-android-aab
          path: ./artinfo.aab
          if-no-files-found: ignore
          retention-days: 14

      # Play Console 에 앱을 처음 만들고 첫 .aab 를 손으로 올린 뒤부터 동작한다 (API 로는 첫 업로드 불가)
      - name: Upload to Play Console (internal testing)
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없어 Play 업로드는 건너뜁니다 — artifact 의 artinfo.aab 를 콘솔에 직접 올리세요"
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$HOME/play-service-account.json"
          sudo gem install fastlane --no-document
          fastlane run upload_to_play_store \
            package_name:"$APP_ID" \
            aab:./artinfo.aab \
            track:internal \
            json_key:"$HOME/play-service-account.json" \
            skip_upload_metadata:true skip_upload_images:true skip_upload_screenshots:true
